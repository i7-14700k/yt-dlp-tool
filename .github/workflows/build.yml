name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Qt runtime libraries
        run: sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - name: FFmpeg for tests (the same builds Ingest installs)
        run: |
          curl -sSL -o ff.tar.xz https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir ff && tar -xJf ff.tar.xz -C ff --strip-components=1
          echo "INGEST_TEST_FFMPEG=$PWD/ff/bin/ffmpeg" >> "$GITHUB_ENV"
          echo "INGEST_TEST_FFPROBE=$PWD/ff/bin/ffprobe" >> "$GITHUB_ENV"
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = (Select-String -Path src/ingest/__init__.py -Pattern '__version__ = "(.+)"').Matches[0].Groups[1].Value
          "version=$v" >> $env:GITHUB_OUTPUT
      - name: FFmpeg for tests
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip -DestinationPath ff
          $bin = (Get-ChildItem ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "INGEST_TEST_FFMPEG=$bin\ffmpeg.exe" >> $env:GITHUB_ENV
          "INGEST_TEST_FFPROBE=$bin\ffprobe.exe" >> $env:GITHUB_ENV
      - name: Tests
        run: python -m pytest -q
      - name: Build Ingest.exe
        run: pyinstaller --noconfirm packaging/ingest.spec
      - name: Self-test the frozen build (Windows platform plugin, fonts, every page)
        shell: pwsh
        run: |
          $env:INGEST_HOME = "$env:RUNNER_TEMP\ingest-home"
          $env:INGEST_DEMO_INFO = "$PWD\tests\data\inspect_demo.json"
          $p = Start-Process -FilePath dist\Ingest\Ingest.exe -Wait -PassThru -ArgumentList @(
            "--selftest", "--screenshot", "$env:RUNNER_TEMP\screens", "--report", "$env:RUNNER_TEMP\selftest.json")
          Get-Content "$env:RUNNER_TEMP\selftest.json"
          if ($p.ExitCode -ne 0) { throw "selftest exited with $($p.ExitCode)" }
      - name: End-to-end download with the frozen build
        shell: pwsh
        run: |
          $env:INGEST_HOME = "$env:RUNNER_TEMP\ingest-home"
          $ok = $false
          foreach ($url in @("https://streamable.com/moo", "https://x.com/SpaceX/status/1732824684683784516")) {
            $p = Start-Process -FilePath dist\Ingest\Ingest.exe -Wait -PassThru -ArgumentList @(
              "--e2e", $url, "--report", "$env:RUNNER_TEMP\e2e.json")
            $r = Get-Content "$env:RUNNER_TEMP\e2e.json" -Raw | ConvertFrom-Json
            $r.steps | ForEach-Object { Write-Output $_ }
            foreach ($j in $r.jobs) { Write-Output "$($j.status): $($j.title) -> $($j.outputs) [$($j.plan)]" }
            if ($p.ExitCode -eq 0) { $ok = $true; break }
            $r.jobs | ForEach-Object { Write-Output $_.log }
          }
          if (-not $ok) { throw "no end-to-end download succeeded" }
      - name: Restamp check with a Twitch clip (informational; sites come and go)
        shell: pwsh
        continue-on-error: true
        run: |
          $env:INGEST_HOME = "$env:RUNNER_TEMP\ingest-home"
          $p = Start-Process -FilePath dist\Ingest\Ingest.exe -Wait -PassThru -ArgumentList @(
            "--e2e", "https://clips.twitch.tv/FaintLightGullWholeWheat", "--report", "$env:RUNNER_TEMP\e2e-twitch.json")
          $r = Get-Content "$env:RUNNER_TEMP\e2e-twitch.json" -Raw | ConvertFrom-Json
          foreach ($j in $r.jobs) { Write-Output "$($j.status): $($j.title) [$($j.plan)]" }
          if ($p.ExitCode -ne 0) { $r.jobs | ForEach-Object { Write-Output $_.log }; throw "Twitch clip failed" }
      - name: Installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc /Qp "/DAppVersion=${{ steps.ver.outputs.version }}" packaging\ingest.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
      - name: Portable zip
        shell: pwsh
        run: Compress-Archive -Path dist\Ingest -DestinationPath "dist\Ingest-${{ steps.ver.outputs.version }}-portable-x64.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: Ingest-${{ steps.ver.outputs.version }}-windows-x64
          path: |
            dist/Ingest-*-Setup-x64.exe
            dist/Ingest-*-portable-x64.zip
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: screens-and-reports
          path: |
            ${{ runner.temp }}/screens
            ${{ runner.temp }}/selftest.json
            ${{ runner.temp }}/e2e.json
            ${{ runner.temp }}/e2e-twitch.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test-linux, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Check release version
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = re.search(r'__version__ = "([^"]+)"', Path('src/ingest/__init__.py').read_text())[1]
          tag = os.environ['GITHUB_REF_NAME']
          if tag != f'v{version}':
              raise SystemExit(f'Tag {tag} does not match app version {version}')
          if not Path(f'docs/releases/{tag}.md').is_file():
              raise SystemExit(f'Missing release notes for {tag}')
          PY
      - uses: actions/download-artifact@v6
        with:
          pattern: Ingest-*-windows-x64
          merge-multiple: true
          path: release
      - name: Checksum Windows downloads
        working-directory: release
        run: sha256sum Ingest-*-Setup-x64.exe Ingest-*-portable-x64.zip > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --verify-tag --draft \
            --title "Ingest ${GITHUB_REF_NAME#v}" \
            --notes-file "docs/releases/$GITHUB_REF_NAME.md"
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
